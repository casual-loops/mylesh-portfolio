name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Node 24 validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Validate published operations data
        run: npm run validate:operations

      - name: Run operations tests
        run: npm run test:operations

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Audit high and critical vulnerabilities
        run: npm audit --audit-level=high
